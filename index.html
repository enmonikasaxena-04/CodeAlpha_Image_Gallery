<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery | Monika Saxena</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<header>

    <div class="logo">
        <h2>Image Gallery</h2>
    </div>

    <div class="buttons">

        <button class="filter-btn active" data-name="all">
            All
        </button>

        <button class="filter-btn" data-name="nature">
            Nature
        </button>

        <button class="filter-btn" data-name="city">
            City
        </button>

        <button class="filter-btn" data-name="animals">
            Animals
        </button>

    </div>

</header>

<section class="gallery">

<div class="card nature">
<img src="https://picsum.photos/id/1015/600/400">
</div>

<div class="card city">
<img src="https://picsum.photos/id/1011/600/400">
</div>

<div class="card animals">
<img src="https://picsum.photos/id/237/600/400">
</div>

<div class="card nature">
<img src="https://picsum.photos/id/1040/600/400">
</div>

<div class="card city">
<img src="https://picsum.photos/id/1031/600/400">
</div>

<div class="card animals">
<img src="https://picsum.photos/id/433/600/400">
</div>

<div class="card nature">
<img src="https://picsum.photos/id/1025/600/400">
</div>

<div class="card city">
<img src="https://picsum.photos/id/1069/600/400">
</div>

<div class="card animals">
<img src="https://picsum.photos/id/219/600/400">
</div>

<div class="card nature">
<img src="https://picsum.photos/id/1056/600/400">
</div>

<div class="card city">
<img src="https://picsum.photos/id/1076/600/400">
</div>

<div class="card animals">
<img src="https://picsum.photos/id/593/600/400">
</div>

</section>

<div class="preview-box">

<span class="close">
<i class="fa-solid fa-xmark"></i>
</span>

<img src="" id="previewImg">

</div>

<footer>

<p>© 2026 Monika Saxena | CodeAlpha Image Gallery</p>

</footer>

<script src="script.js"></script>

</body>
</html>
